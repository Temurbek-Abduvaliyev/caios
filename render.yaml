services:
  - type: web
    name: hujjat-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 5.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_KEYS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_CONTACT
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
